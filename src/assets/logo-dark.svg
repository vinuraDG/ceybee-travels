<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <!-- Bee body -->
  <g transform="translate(120, 12)">
    <!-- Wings left -->
    <ellipse cx="-18" cy="22" rx="18" ry="11" fill="#17A58A" opacity="0.5" transform="rotate(-20 -18 22)"/>
    <ellipse cx="-14" cy="32" rx="14" ry="8" fill="#17A58A" opacity="0.35" transform="rotate(-10 -14 32)"/>
    <!-- Wings right -->
    <ellipse cx="18" cy="22" rx="18" ry="11" fill="#17A58A" opacity="0.5" transform="rotate(20 18 22)"/>
    <ellipse cx="14" cy="32" rx="14" ry="8" fill="#17A58A" opacity="0.35" transform="rotate(10 14 32)"/>
    <!-- Body -->
    <ellipse cx="0" cy="34" rx="12" ry="20" fill="#0A1628"/>
    <!-- Stripes -->
    <rect x="-11" y="28" width="22" height="5" rx="2" fill="#C9A84C"/>
    <rect x="-11" y="37" width="22" height="5" rx="2" fill="#C9A84C"/>
    <rect x="-9" y="46" width="18" height="4" rx="2" fill="#C9A84C"/>
    <!-- Head -->
    <circle cx="0" cy="14" r="10" fill="#0A1628"/>
    <!-- Eyes -->
    <circle cx="-4" cy="12" r="2" fill="#C9A84C"/>
    <circle cx="4" cy="12" r="2" fill="#C9A84C"/>
    <!-- Antennae -->
    <line x1="-4" y1="5" x2="-8" y2="-2" stroke="#0A1628" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-8" cy="-3" r="2" fill="#17A58A"/>
    <line x1="4" y1="5" x2="8" y2="-2" stroke="#0A1628" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="-3" r="2" fill="#17A58A"/>
  </g>
  <!-- Text: Cey -->
  <text x="8" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0A1628">Cey</text>
  <!-- Text: Bee -->
  <text x="162" y="62" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#0A1628">Bee</text>
  <!-- TRAVELS -->
  <text x="80" y="90" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#17A58A" letter-spacing="6" text-anchor="middle">TRAVELS</text>
</svg>
